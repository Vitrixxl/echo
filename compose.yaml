# Deployed by pihost on the Pi (pihost add <repo> echo): Caddy serves this on https://brancard.vitrixxl.fr,
# and on echo.vitrixxl.fr for APKs installed before the rename (their update URL is baked in).
# DEPLOY_TOKEN (uploads from scripts/deploy.ts) lives in .env, edited with `pihost env echo`.
services:
  api:
    build: ./server
    expose: ["8787"]
    env_file:
      - path: .env
        required: false
    environment:
      TRUST_PROXY: "1"
    volumes:
      - data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/server", "--health"]
      interval: 30s
      timeout: 5s
volumes:
  data:
